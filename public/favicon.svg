  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="50" cy="50" r="32" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="42" cy="38" r="10" fill="#ffffff" opacity="0.4"/>
  <text x="50" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">9</text>
